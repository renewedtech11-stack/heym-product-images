:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){--bg:#13151a;--card:#1c1f26;--ink:#e9ecf2;--mut:#99a1b0;--line:#2b2f39;--accent:#6f94ff;--chip:#262a33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151a;--card:#1c1f26;--ink:#e9ecf2;--mut:#99a1b0;--line:#2b2f39;--accent:#6f94ff;--chip:#262a33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:13px}
.cat{font-size:15px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.cat .c{font-size:11px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card .ph{width:100%;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain}
.card .cap{padding:7px 9px}
.card .m{font-size:11.5px;font-weight:700;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;word-break:break-all;line-height:1.3}
.card .n{font-size:10.5px;color:var(--mut)}
.hide{display:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:none;flex-direction:column}
.lb.on{display:flex}
.lb .hd{color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.lb .x{cursor:pointer;font-size:22px;line-height:1}
.lb .strip{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 20px}
.lb .strip img{width:100%;background:#fff;border-radius:8px}

let tm=0,ti=0;
document.getElementById('sub').textContent='133 models · 485 photos · hosted on GitHub/jsDelivr · updated 2026-10-05';
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){const el=document.getElementById('view');let h='';
 for(const cat of Object.keys(data)){
  const rows=data[cat];
  h+='<div class="cat" data-cat="'+cat+'">'+cat+' <span class="c">'+rows.length+' models</span></div><div class="grid" data-g="'+cat+'">';
  for(let i=0;i<rows.length;i++){const r=rows[i];
   h+='<div class="card" data-cat="'+esc(cat)+'" data-idx="'+i+'" data-s="'+esc((cat+' '+r.model).toLowerCase())+'">'+
   '<div class="ph"><img loading="lazy" src="'+r.imgs[0]+'"></div><div class="cap"><div class="m">'+esc(r.model)+'</div><div class="n">'+r.n+' pic'+(r.n>1?'s':'')+'</div></div></div>';}
  h+='</div>';
 }
 el.innerHTML=h;}
function openLb(cat,idx){const r=data[cat][idx];
 document.getElementById('lbt').textContent=r.model+' — '+r.imgs.length+' photos';
 document.getElementById('lbs').innerHTML=r.imgs.map(u=>'<img loading="lazy" src="'+u+'">').join('');
 document.getElementById('lb').classList.add('on');}
function closeLb(){document.getElementById('lb').classList.remove('on');}
document.getElementById('view').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openLb(c.dataset.cat,+c.dataset.idx);});
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.toLowerCase().trim();
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',v&&!c.dataset.s.includes(v)));
 document.querySelectorAll('[data-g]').forEach(g=>{const any=[...g.querySelectorAll('.card')].some(c=>!c.classList.contains('hide'));g.classList.toggle('hide',!any);g.previousElementSibling.classList.toggle('hide',!any);});});
render();
